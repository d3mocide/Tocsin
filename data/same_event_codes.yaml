FFS: { name: Flash Flood Statement, tier: B }
FLW: { name: Flood Warning, tier: B }
FLA: { name: Flood Watch, tier: B }
FLS: { name: Flood Statement, tier: B }
CFW: { name: Coastal Flood Warning, tier: B }
CFA: { name: Coastal Flood Watch, tier: B }
WSW: { name: Winter Storm Warning, tier: B }
WSA: { name: Winter Storm Watch, tier: B }
BZW: { name: Blizzard Warning, tier: B }
FZW: { name: Freeze Warning, tier: B }
HWW: { name: High Wind Warning, tier: B }
HWA: { name: High Wind Watch, tier: B }
DSW: { name: Dust Storm Warning, tier: B }
HUW: { name: Hurricane Warning, tier: B }
HUA: { name: Hurricane Watch, tier: B }
TRW: { name: Tropical Storm Warning, tier: B }
TRA: { name: Tropical Storm Watch, tier: B }
TSA: { name: Tsunami Watch, tier: B }
SSW: { name: Storm Surge Warning, tier: B }
SSA: { name: Storm Surge Watch, tier: B }
SMW: { name: Special Marine Warning, tier: B }
AVA: { name: Avalanche Watch, tier: B }
