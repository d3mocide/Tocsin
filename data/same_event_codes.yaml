# SAME (EAS) event codes -> name and dispatch tier, per docs/design-spec.md
# §4. Checked in as data, not hardcoded, because NWS revises this list
# periodically -- confirm against the current NWS event code list before an
# operational deployment (docs/design-spec.md §12 open item).
#
# Tier A: mesh + MQTT. dispatcher stage 1 (docs/design-spec.md §7) fires
#         immediately on these, straight from the SAME header.
# Tier B: MQTT only. Watches, advisories, and statements.
# Tier C: log only. Tests and routine programming.
#
# The Tier A set below is exactly the list given in docs/design-spec.md §4:
# TOR SVR FFW EWW TSW CEM CDW LEW SPW EQW VOW AVW HMW NUW RHW.

# --- Tier A: immediate-threat warnings -------------------------------------
TOR: { name: Tornado Warning, tier: A }
SVR: { name: Severe Thunderstorm Warning, tier: A }
FFW: { name: Flash Flood Warning, tier: A }
EWW: { name: Extreme Wind Warning, tier: A }
TSW: { name: Tsunami Warning, tier: A }
CEM: { name: Civil Emergency Message, tier: A }
CDW: { name: Civil Danger Warning, tier: A }
LEW: { name: Law Enforcement Warning, tier: A }
SPW: { name: Shelter In Place Warning, tier: A }
EQW: { name: Earthquake Warning, tier: A }
VOW: { name: Volcano Warning, tier: A }
AVW: { name: Avalanche Warning, tier: A }
HMW: { name: Hazardous Materials Warning, tier: A }
NUW: { name: Nuclear Power Plant Warning, tier: A }
RHW: { name: Radiological Hazard Warning, tier: A }
# Not in the docs/design-spec.md §4 Tier A list verbatim, but a national
# EAS activation is by definition the highest-severity possible message on
# this system -- it must not be lumped in with routine tests below.
EAN: { name: Emergency Action Notification, tier: A }

