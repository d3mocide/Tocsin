# NOAA Weather Radio (NWR) transmitter stations covering Oregon, per
# docs/design/master-prompt.md §12 open item ("verify local transmitter
# frequencies against the live waterfall before hardcoding"). Checked in as
# data, not hardcoded, for the same reason as same_event_codes.yaml -- NWS
# adds/relocates transmitters occasionally; confirm against the current list
# before an operational deployment.
#
# `api`'s `/reference` endpoint (services/api/src/api/reference.py) serves
# this file and, when TOCSIN_LATITUDE/TOCSIN_LONGITUDE are set, annotates
# each entry with distance_km from the operator so the web UI can list
# nearby stations -- see that module's docstring. This does not replace the
# empirical waterfall confirmation the §12 open item calls for; it narrows
# down which callsign/frequency to expect at a given antenna location.
#
# Fields, and where each came from:
#   name           -- transmitter site name. Source: weather.gov/nwr/stations?State=OR
#                      (fetched 2026-08-09).
#   frequency_mhz  -- carrier frequency in MHz (one of the seven NWR channels;
#                      see services/sdr_rx/src/sdr_rx/channels.py). Same source.
#   status         -- operational status as published (e.g. NORMAL). Same source.
#   wfo            -- NWS Weather Forecast Office that operates the transmitter
#                      (not necessarily in Oregon -- e.g. Burns Butte is run out
#                      of Boise ID, Brookings out of Eureka CA). Same source.
#   power_watts    -- transmitter power in watts. Source: radiostation.info
#                      (fetched 2026-08-09) -- weather.gov's station list doesn't
#                      publish wattage, only the `status` field above.
#   lat / lon      -- transmitter coordinates, decimal degrees. Same source as
#                      power_watts; a third-party aggregator, not NWS's own
#                      published coordinates (no public NWS page serving them was
#                      reachable while authoring this file -- see the open item
#                      this data feeds). Treat as approximate. `null` for the two
#                      stations (WZ2522 Carney Butte, WZ2559 Enterprise) where
#                      that source had no coordinates either -- distance_km is
#                      omitted for those rather than guessed.

