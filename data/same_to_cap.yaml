# SAME event code -> CAP `event` field text, for fusion's correlation key
# (docs/design/master-prompt.md §5): (SAME event code <-> CAP event name) AND (FIPS
# overlap) AND (issue times within tolerance).
#
# NWS CAP payloads carry the event name as free text in the <event>
# element; in practice it matches the SAME code's descriptive name
# verbatim, which is why this file looks like a near-duplicate of
# same_event_codes.yaml's `name` fields. Keep it a separate file anyway --
# CAP's product set doesn't fully match SAME's (§5: "CAP...includes
# products never broadcast on NWR"), so this mapping and the tier table
# are allowed to diverge over time. Verify against live CAP payloads before
# relying on it operationally (docs/design/master-prompt.md §12).

