# Minimal local broker config for development. Tocsin is personal/emergency
# use (docs/design/master-prompt.md §11, non-goals) -- this broker is not meant to be
# exposed beyond the local network. Before exposing it more broadly, add
# password_file / TLS per the Mosquitto docs.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
