[project]
name = "nws-poller"
version = "0.1.0"
description = "ETag-conditional poller for api.weather.gov/alerts/active -- hybrid-only CAP alert source"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "redis>=5.0",
]

[project.scripts]
nws-poller = "nws_poller:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
