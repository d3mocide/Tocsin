[project]
name = "segment-capture"
version = "0.1.0"
description = "Captures a full SAME voice-message clip (header through EOM) from sdr-rx's ring buffer, trimmed-boundary metadata included"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyzmq>=25.1",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
segment-capture = "segment_capture:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
