[project]
name = "same-decoder"
version = "0.1.0"
description = "multimon-ng EAS/SAME decoder -- ZCZC headers to structured, tiered events"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyzmq>=25.1",
    "pyyaml>=6.0",
]

[project.scripts]
same-decoder = "same_decoder:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
