[project]
name = "dispatcher"
version = "0.1.0"
description = "Stage-1/stage-2 alert dispatch over Meshtastic + MQTT, with rate limiting and idempotency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0",
    "meshtastic>=2.5",
]

[project.scripts]
dispatcher = "dispatcher:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
