[project]
name = "live-audio"
version = "0.1.0"
description = "Feeds sdr-rx's 16kHz stt.* ZMQ stream into Icecast as per-channel Ogg/Vorbis streams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyzmq>=25.1",
    "pyyaml>=6.0",
]

[project.scripts]
live-audio = "live_audio:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
