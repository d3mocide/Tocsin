[project]
name = "stt-worker"
version = "0.1.0"
description = "Trims a segment_capture WAV to voice-only, transcribes it with whisper.cpp, and guards against hallucinated output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyzmq>=25.1",
    "redis>=5.0",
    "requests>=2.31",
]

[project.scripts]
stt-worker = "stt_worker:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
