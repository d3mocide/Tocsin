[project]
name = "sdr-rx"
version = "0.1.0"
description = "SoapySDR + numpy polyphase channelizer for NOAA Weather Radio (162.4-162.55 MHz)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyzmq>=25.1",
]

[project.scripts]
sdr-rx = "sdr_rx:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
