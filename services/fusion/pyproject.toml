[project]
name = "fusion"
version = "0.1.0"
description = "Correlates SAME/NWR events with NWS CAP alerts into a provenance-preserving canonical alert feed"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "redis>=5.0",
]

[project.scripts]
fusion = "fusion:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
