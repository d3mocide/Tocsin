# Tocsin -- one compose file, two profiles.
#   TOCSIN_MODE=offgrid docker compose --profile offgrid up
#   TOCSIN_MODE=hybrid  docker compose --profile hybrid up

x-mode: &mode ${TOCSIN_MODE:-offgrid}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    profiles: [offgrid, hybrid]

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tocsin
      POSTGRES_USER: tocsin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    # api waits for "healthy", not just "started" -- Postgres isn't ready
    # for real queries right after boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles: [offgrid, hybrid]

  sdr-rx:
    # Also builds same_decoder, live_audio, and segment_capture into this
    # image -- see entrypoint.sh.
    build:
      context: .
      dockerfile: services/sdr_rx/Dockerfile
    restart: unless-stopped
    environment:
      TOCSIN_MODE: *mode
      SDR_RX_DEVICES: ${SDR_RX_DEVICES:-}
      # Raise if SAME fails to decode, lower if the spectrum saturates.
      SDR_RX_GAIN_DB: ${SDR_RX_GAIN_DB:-30}
      # Live-audio squelch only; never affects SAME decode.
      SDR_RX_SQUELCH_OPEN_DB: ${SDR_RX_SQUELCH_OPEN_DB:-8.0}
      # Channels to stream to Icecast, e.g. WX5,WX7. Blank = all 7. Doesn't
      # affect SAME decode.
      LIVE_AUDIO_CHANNELS: ${LIVE_AUDIO_CHANNELS:-}
      SDR_RX_ZMQ_BIND: tcp://0.0.0.0:5555
      SDR_RX_RING_BUFFER_DIR: /run/sdr_rx_ring
      SDR_RX_REDIS_URL: redis://redis:6379/0
      # localhost, not tcp://sdr-rx:5555 -- same container now.
      SAME_DECODER_ZMQ_CONNECT: tcp://localhost:5555
      TOCSIN_DATA_DIR: /app/data
      SAME_DECODER_REDIS_URL: redis://redis:6379/0
      LIVE_AUDIO_ZMQ_CONNECT: tcp://localhost:5555
      ICECAST_HOST: icecast
      ICECAST_PORT: ${ICECAST_PORT:-8000}
      ICECAST_SOURCE_USER: source
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_STREAM_NAME_TEMPLATE: ${ICECAST_STREAM_NAME_TEMPLATE:-Tocsin {site} {channel}}
      ICECAST_STREAM_DESCRIPTION: ${ICECAST_STREAM_DESCRIPTION:-Tocsin NOAA Weather Radio relay}
      ICECAST_STREAM_GENRE: ${ICECAST_STREAM_GENRE:-weather}
      # Optional metadata.yaml for display-name overrides; see
      # services/live_audio/README.md.
      LIVE_AUDIO_METADATA_CONFIG: ${LIVE_AUDIO_METADATA_CONFIG:-}
      LIVE_AUDIO_REDIS_URL: redis://redis:6379/0
      SEGMENT_CAPTURE_ZMQ_CONNECT: tcp://localhost:5555
      SEGMENT_CAPTURE_REDIS_URL: redis://redis:6379/0
      # stt-worker (a separate container) connects to this port by this
      # service's name.
      SEGMENT_CAPTURE_ZMQ_BIND: tcp://0.0.0.0:5556
      SEGMENT_CAPTURE_RING_BUFFER_DIR: /run/sdr_rx_ring
      SEGMENT_CAPTURE_OUTPUT_DIR: /var/lib/segment_capture/captures
      # Continuous, non-SAME-gated transcription of one channel -- off by
      # default (see .env.example). Blank site/channel is a no-op even if
      # enabled=true (segment_capture logs and continues without it).
      LIVE_TRANSCRIPTION_ENABLED: ${LIVE_TRANSCRIPTION_ENABLED:-false}
      LIVE_TRANSCRIPTION_SITE: ${LIVE_TRANSCRIPTION_SITE:-}
      LIVE_TRANSCRIPTION_CHANNEL: ${LIVE_TRANSCRIPTION_CHANNEL:-}
      # VAD tuning. The threshold is uncalibrated by default -- segment-capture
      # logs measured levels beside it periodically; tune from that line.
      LIVE_TRANSCRIPTION_RMS_THRESHOLD: ${LIVE_TRANSCRIPTION_RMS_THRESHOLD:-}
      LIVE_TRANSCRIPTION_MIN_CHUNK_SECONDS: ${LIVE_TRANSCRIPTION_MIN_CHUNK_SECONDS:-}
      LIVE_TRANSCRIPTION_MAX_CHUNK_SECONDS: ${LIVE_TRANSCRIPTION_MAX_CHUNK_SECONDS:-}
      LIVE_TRANSCRIPTION_SILENCE_HANG_SECONDS: ${LIVE_TRANSCRIPTION_SILENCE_HANG_SECONDS:-}
      LIVE_TRANSCRIPTION_STATUS_INTERVAL_SECONDS: ${LIVE_TRANSCRIPTION_STATUS_INTERVAL_SECONDS:-300}
    depends_on:
      - redis
      - icecast
    # Private per-container buffer -- not shared, since same-decoder and
    # segment-capture run in this container now too.
    tmpfs:
      - /run/sdr_rx_ring
    volumes:
      - ./data:/app/data:ro
      - segment-captures:/var/lib/segment_capture/captures
    # devices: lives in compose.sdr.yaml (make up-offgrid/up-hybrid add it,
    # dev-stack omits it) -- Docker refuses to start a container whose
    # devices: path is missing. Needs the udev rule in deploy/udev/ too;
    # see this service's README for the full bring-up sequence.
    profiles: [offgrid, hybrid]

  icecast:
    build: ./deploy/icecast
    restart: unless-stopped
    environment:
      # Rendered into icecast.xml's listen port by entrypoint.sh.
      ICECAST_PORT: ${ICECAST_PORT:-8000}
      # Rendered into icecast.xml; must match sdr-rx's
      # ICECAST_SOURCE_PASSWORD above. Change both before exposing past
      # localhost.
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      # Icecast's own admin UI/status-page password.
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-hackme}
    ports:
      # Host and container port must match -- the browser reaches a mount
      # by host port, live-audio/api by container port, both ICECAST_PORT.
      - "${ICECAST_PORT:-8000}:${ICECAST_PORT:-8000}"
    profiles: [offgrid, hybrid]

  stt-worker:
    build: ./services/stt_worker
    # A missing model file waits instead of failing -- see await_model.
    restart: on-failure
    environment:
      # sdr-rx, not segment-capture -- shares that container now.
      STT_WORKER_ZMQ_CONNECT: tcp://sdr-rx:5556
      STT_WORKER_MODEL_PATH: /models/${STT_WORKER_MODEL_FILE:-ggml-base.en.bin}
      STT_WORKER_INITIAL_PROMPT: ${STT_WORKER_INITIAL_PROMPT:-}
      STT_WORKER_REDIS_URL: redis://redis:6379/0
      # local-only by default; set STT_CHAIN=local,remote plus the
      # REMOTE_* vars below for hybrid.
      STT_CHAIN: ${STT_CHAIN:-local}
      STT_WORKER_REMOTE_BASE_URL: ${STT_WORKER_REMOTE_BASE_URL:-}
      STT_WORKER_REMOTE_API_KEY: ${STT_WORKER_REMOTE_API_KEY:-}
      STT_WORKER_REMOTE_MODEL: ${STT_WORKER_REMOTE_MODEL:-whisper-1}
      # data/keyword_triggers.yaml + data/same_event_codes.yaml, for
      # keyword-matching live transcripts (see LIVE_TRANSCRIPTION_ENABLED
      # on sdr-rx above). Needed regardless of whether live transcription
      # is on -- see keyword_match._default_data_dir's own docstring for
      # why this can't be inferred inside the container.
      TOCSIN_DATA_DIR: /app/data
    volumes:
      - segment-captures:/var/lib/segment_capture/captures
      - ./models:/models:ro
      - ./data:/app/data:ro
    depends_on:
      - sdr-rx
      - redis
    profiles: [offgrid, hybrid]

  fusion:
    # Also builds nws_poller as a second, independent venv -- see entrypoint.sh.
    build:
      context: .
      dockerfile: services/fusion/Dockerfile
    restart: unless-stopped
    environment:
      TOCSIN_MODE: *mode
      TOCSIN_DATA_DIR: /app/data
      FUSION_REDIS_URL: redis://redis:6379/0
      # nws-poller's env -- entrypoint.sh only starts that process under
      # TOCSIN_MODE=hybrid.
      NWS_POLLER_USER_AGENT: ${NWS_POLLER_USER_AGENT:-}
      NWS_POLLER_AREAS: ${NWS_POLLER_AREAS-OR,WA}
      NWS_POLLER_ZONES: ${NWS_POLLER_ZONES:-}
      NWS_POLLER_STRICT_ZONE_FILTER: ${NWS_POLLER_STRICT_ZONE_FILTER:-false}
      NWS_POLLER_MAX_RADIUS_MILES: ${NWS_POLLER_MAX_RADIUS_MILES:-100}
      TOCSIN_LATITUDE: ${TOCSIN_LATITUDE:-}
      TOCSIN_LONGITUDE: ${TOCSIN_LONGITUDE:-}
      NWS_POLLER_INTERVAL_SECONDS: ${NWS_POLLER_INTERVAL_SECONDS:-60}
      NWS_POLLER_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - redis
    # fusion always runs (offgrid alerts stay RF_ONLY); the nws-poller half
    # self-gates on TOCSIN_MODE instead.
    profiles: [offgrid, hybrid]

  dispatcher:
    build: ./services/dispatcher
    # on-failure: a missing/unattached Meshtastic node is retriable.
    restart: on-failure
    environment:
      TOCSIN_MODE: *mode
      TOCSIN_DATA_DIR: /app/data
      DISPATCHER_REDIS_URL: redis://redis:6379/0
      # Unset -> meshtastic-python autodetects the device; only needed if
      # more than one serial device is attached.
      MESHTASTIC_SERIAL_DEV_PATH: ${MESHTASTIC_SERIAL_DEV_PATH:-}
      # false here, true in compose.mesh.yaml -- that overlay is the
      # single switch for mesh transmit.
      MESHTASTIC_ENABLED: ${MESHTASTIC_ENABLED:-false}
      # serial | tcp. tcp needs no device mapping -- just set
      # MESHTASTIC_ENABLED=true rather than adding compose.mesh.yaml.
      MESHTASTIC_TRANSPORT: ${MESHTASTIC_TRANSPORT:-serial}
      MESHTASTIC_TCP_HOST: ${MESHTASTIC_TCP_HOST:-}
      MESHTASTIC_TCP_PORT: ${MESHTASTIC_TCP_PORT:-4403}
      # Unset -> node's Primary channel (index 0).
      MESHTASTIC_CHANNEL_INDEX: ${MESHTASTIC_CHANNEL_INDEX:-}
      # Unset -> stage 2 disabled entirely.
      DISPATCHER_LITELLM_BASE_URL: ${DISPATCHER_LITELLM_BASE_URL:-}
      DISPATCHER_LITELLM_API_KEY: ${DISPATCHER_LITELLM_API_KEY:-}
      DISPATCHER_LITELLM_MODEL: ${DISPATCHER_LITELLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/app/data:ro
    # devices: lives in compose.mesh.yaml so a receive-only station needs
    # no node mapped.
    depends_on:
      - redis
      - fusion
    # both: stage 1 works identically off-grid. Stage 2's LiteLLM call is
    # the only mode/config-gated part.
    profiles: [offgrid, hybrid]

  api:
    # Dockerfile also builds web/ into static/ (first stage).
    build:
      context: .
      dockerfile: services/api/Dockerfile
    # on-failure: exits loudly on bad config/password rather than looping
    # a traceback.
    restart: on-failure
    environment:
      # Passed as parts, not one DSN string -- a password containing
      # @:/?# would otherwise parse wrong. API_POSTGRES_DSN overrides if set.
      API_POSTGRES_HOST: timescaledb
      API_POSTGRES_PORT: "5432"
      API_POSTGRES_USER: tocsin
      API_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      API_POSTGRES_DB: tocsin
      API_REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      # Surfaced via GET /system so the UI can render offgrid vs. hybrid
      # correctly.
      TOCSIN_MODE: *mode
      # SAME event codes + FIPS table for GET /reference.
      TOCSIN_DATA_DIR: /app/data
      # Adds distance_km to GET /reference's stations; null if unset.
      TOCSIN_LATITUDE: ${TOCSIN_LATITUDE:-}
      TOCSIN_LONGITUDE: ${TOCSIN_LONGITUDE:-}
      # segment-capture's WAV output, served at GET /captures/{name}.
      API_CAPTURES_DIR: /var/lib/segment_capture/captures
      ICECAST_HOST: icecast
      ICECAST_PORT: ${ICECAST_PORT:-8000}
      # Browser-facing Icecast URL. Unset = same host as ICECAST_PORT; set
      # behind a reverse proxy (absolute URL, or a relative path like
      # /stream to proxy audio through api itself).
      ICECAST_PUBLIC_URL: ${ICECAST_PUBLIC_URL:-}
    volumes:
      - ./data:/app/data:ro
      # read-only -- segment-capture is the only writer.
      - segment-captures:/var/lib/segment_capture/captures:ro
    ports:
      # Change TOCSIN_WEB_PORT if 8080 is taken; API_PORT only matters
      # inside the container.
      - "${TOCSIN_WEB_PORT:-8080}:${API_PORT:-8000}"
    depends_on:
      redis:
        condition: service_started
      # healthy, not just started -- Postgres isn't ready for real queries
      # right after boot.
      timescaledb:
        condition: service_healthy
      # Not required -- /streams degrades gracefully if Icecast is down.
      icecast:
        condition: service_started
    profiles: [offgrid, hybrid]

volumes:
  redis-data:
  timescale-data:
  # Not tmpfs -- captures are worth keeping across a restart.
  segment-captures:
