# Tocsin -- one compose file, two profiles (docs/design/master-prompt.md §1, §9).
#
#   TOCSIN_MODE=offgrid docker compose --profile offgrid up
#   TOCSIN_MODE=hybrid  docker compose --profile hybrid up
#
# Only services with a working implementation are defined below. Everything
# past milestone 1 (docs/design/master-prompt.md §10) is commented out with a pointer
# to its milestone -- uncomment as each is built and proven, per the build
# order. Docker was not available to build/run this file in the sandbox this
# was authored in; verify `docker compose config` and a real `up` on a
# machine with the daemon before relying on it.

x-mode: &mode ${TOCSIN_MODE:-offgrid}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    profiles: [offgrid, hybrid]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    profiles: [offgrid, hybrid]

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tocsin
      POSTGRES_USER: tocsin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    profiles: [offgrid, hybrid]

  sdr-rx:
    build: ./services/sdr_rx
    # on-failure, not unless-stopped: with no SDR_RX_DEVICES configured (a
    # deliberately supported state -- see the README's bring-up runbook),
    # main() reports that and exits 0. unless-stopped restarts on ANY exit
    # including that one, crash-looping a container that isn't actually
    # crashing (confirmed against a real build). on-failure only restarts
    # the exit-1 path (bad serial / device error), which is the case that
    # actually warrants a retry.
    restart: on-failure
    environment:
      TOCSIN_MODE: *mode
      SDR_RX_DEVICES: ${SDR_RX_DEVICES:-}
      SDR_RX_ZMQ_BIND: tcp://0.0.0.0:5555
      SDR_RX_RING_BUFFER_DIR: /run/sdr_rx_ring
    # A named tmpfs volume, not each container's own private `tmpfs:` mount
    # (which is how this looked before segment-capture existed) -- Phase 4's
    # segment-capture reads sdr-rx's ring buffer directly (design doc §3,
    # "pre-roll"), which only works if both containers share the same
    # backing memory, not two independent anonymous tmpfses.
    volumes:
      - sdr-rx-ring:/run/sdr_rx_ring
    devices:
      - /dev/bus/usb:/dev/bus/usb
    # /dev/bus/usb gives the container the whole USB bus rather than one
    # device node, because RTL-SDR dongles enumerate under a bus-relative
    # path that isn't stable across replugs -- device selection happens in
    # the app layer by serial (SDR_RX_DEVICES), not by bind-mounting one
    # /dev/bus/usb/BBB/DDD path. The host also needs the udev rule in
    # deploy/udev/ so the dongle is group-readable without running the
    # container privileged -- see this service's README for the full
    # bring-up sequence (blacklist, udev rule, `make sdr-devices`).
    profiles: [offgrid, hybrid]

  same-decoder:
    build: ./services/same_decoder
    restart: unless-stopped
    environment:
      SAME_DECODER_ZMQ_CONNECT: tcp://sdr-rx:5555
      TOCSIN_DATA_DIR: /app/data
      # Publishes to Redis Streams (tocsin:same_events) for fusion (design
      # doc §5: "Both paths write raw events to Redis Streams before
      # fusion sees them") instead of only logging to stdout.
      SAME_DECODER_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - sdr-rx
      - redis
    profiles: [offgrid, hybrid]

  icecast:
    build: ./deploy/icecast
    restart: unless-stopped
    ports:
      - "8000:8000"
    profiles: [offgrid, hybrid]

  live-audio:
    build: ./services/live_audio
    restart: unless-stopped
    environment:
      LIVE_AUDIO_ZMQ_CONNECT: tcp://sdr-rx:5555
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      ICECAST_SOURCE_USER: source
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_STREAM_NAME_TEMPLATE: ${ICECAST_STREAM_NAME_TEMPLATE:-Tocsin {site} {channel}}
      ICECAST_STREAM_DESCRIPTION: ${ICECAST_STREAM_DESCRIPTION:-Tocsin NOAA Weather Radio relay}
      ICECAST_STREAM_GENRE: ${ICECAST_STREAM_GENRE:-weather}
      # Empty by default -- only set LIVE_AUDIO_METADATA_CONFIG (and uncomment
      # the matching volume below) once you actually have a metadata.yaml
      # with site_names/channel_names display-name overrides to mount; see
      # services/live_audio/README.md.
      LIVE_AUDIO_METADATA_CONFIG: ${LIVE_AUDIO_METADATA_CONFIG:-}
    # volumes:
    #   - ./deploy/live_audio/metadata.yaml:/app/metadata.yaml:ro
    depends_on:
      - sdr-rx
      - icecast
    profiles: [offgrid, hybrid]

  segment-capture:
    build: ./services/segment_capture
    # on-failure, not unless-stopped: main() checks that the sdr-rx-ring
    # volume is actually mounted at startup and exits 1 with a clear
    # message if not (see services/segment_capture/README.md) -- a real
    # failure worth retrying, not a deliberate clean-exit path the way
    # sdr-rx's "no devices configured" is.
    restart: on-failure
    environment:
      SEGMENT_CAPTURE_ZMQ_CONNECT: tcp://sdr-rx:5555
      SEGMENT_CAPTURE_ZMQ_BIND: tcp://0.0.0.0:5556
      SEGMENT_CAPTURE_RING_BUFFER_DIR: /run/sdr_rx_ring
      SEGMENT_CAPTURE_OUTPUT_DIR: /var/lib/segment_capture/captures
    volumes:
      - sdr-rx-ring:/run/sdr_rx_ring
      - segment-captures:/var/lib/segment_capture/captures
    depends_on:
      - sdr-rx
    profiles: [offgrid, hybrid]

  stt-worker:
    build: ./services/stt_worker
    # on-failure: a missing model file (STT_WORKER_MODEL_PATH) is a real,
    # static misconfiguration -- but unlike SDR_RX_DEVICES's old bug, main()
    # already prints one clear line and exits before any traceback, and the
    # very next restart picks up a model dropped into ./models/ with no
    # manual intervention, which is worth the restart loop in the meantime.
    restart: on-failure
    environment:
      STT_WORKER_ZMQ_CONNECT: tcp://segment-capture:5556
      STT_WORKER_MODEL_PATH: /models/${STT_WORKER_MODEL_FILE:-ggml-base.en.bin}
      STT_WORKER_INITIAL_PROMPT: ${STT_WORKER_INITIAL_PROMPT:-}
    volumes:
      - segment-captures:/var/lib/segment_capture/captures
      - ./models:/models:ro
    depends_on:
      - segment-capture
    profiles: [offgrid, hybrid]

  nws-poller:
    build: ./services/nws_poller
    restart: unless-stopped
    environment:
      # Empty by default, not `:?`-required: compose interpolates every
      # service's environment during `config` regardless of which
      # --profile was selected, so a hard-required var here would block
      # `offgrid` startup too even though nws-poller (hybrid-only) never
      # runs there -- exactly the regression CLAUDE.md's connectivity rule
      # warns about. Same pattern as SDR_RX_DEVICES: nws_poller's own
      # __init__.py already fails loudly and exits 1 if this is unset,
      # which only matters (and only restart-loops) under the hybrid
      # profile where the container actually starts.
      NWS_POLLER_USER_AGENT: ${NWS_POLLER_USER_AGENT:-}
      NWS_POLLER_AREAS: ${NWS_POLLER_AREAS:-OR,WA}
      NWS_POLLER_INTERVAL_SECONDS: ${NWS_POLLER_INTERVAL_SECONDS:-60}
      NWS_POLLER_REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    # hybrid only (design doc §8: nws-poller is one of the four
    # network-dependent components offgrid disables entirely) -- this
    # profile gate is the actual "disabled off-grid" mechanism, since
    # there's no in-process TOCSIN_MODE branch to speak of: the process
    # simply never starts under the offgrid profile.
    profiles: [hybrid]

  fusion:
    build: ./services/fusion
    restart: unless-stopped
    environment:
      TOCSIN_MODE: *mode
      TOCSIN_DATA_DIR: /app/data
      FUSION_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - redis
    profiles: [offgrid, hybrid]

  # dispatcher:                # milestone 6-7
  #   build: ./services/dispatcher
  #   profiles: [offgrid, hybrid]

  # api:                       # milestone 8
  #   build: ./services/api
  #   profiles: [offgrid, hybrid]

  # web:                       # milestone 8
  #   build: ./web
  #   profiles: [offgrid, hybrid]

volumes:
  redis-data:
  mosquitto-data:
  timescale-data:
  # tmpfs-backed so it behaves like sdr-rx's old per-container tmpfs mount
  # (fast, ephemeral, in-memory) while still being shareable with
  # segment-capture -- a plain named volume would persist to disk instead.
  sdr-rx-ring:
    driver_opts:
      type: tmpfs
      device: tmpfs
  # Not tmpfs: finished captures are real data worth keeping across a
  # restart (replay, debugging a bad transcript), unlike the raw ring
  # buffer they're extracted from.
  segment-captures:
