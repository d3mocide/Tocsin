# Tocsin -- one compose file, two profiles (docs/design/master-prompt.md §1, §9).
#
#   TOCSIN_MODE=offgrid docker compose --profile offgrid up
#   TOCSIN_MODE=hybrid  docker compose --profile hybrid up
#
# Only services with a working implementation are defined below. Everything
# past milestone 1 (docs/design/master-prompt.md §10) is commented out with a pointer
# to its milestone -- uncomment as each is built and proven, per the build
# order. Docker was not available to build/run this file in the sandbox this
# was authored in; verify `docker compose config` and a real `up` on a
# machine with the daemon before relying on it.

x-mode: &mode ${TOCSIN_MODE:-offgrid}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    profiles: [offgrid, hybrid]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    profiles: [offgrid, hybrid]

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tocsin
      POSTGRES_USER: tocsin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    # api waits on this (`condition: service_healthy`) rather than racing a
    # database that accepts TCP connections a few seconds before it has
    # finished first-boot initialization.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles: [offgrid, hybrid]

  sdr-rx:
    # Build context is the repo root, not services/sdr_rx/ -- this image
    # also installs same_decoder, live_audio, and segment_capture
    # (formerly their own containers; see entrypoint.sh for why they now
    # share this one). restart: unless-stopped at the compose level is a
    # last-resort safety net for the entrypoint script itself crashing --
    # each of the four processes' own on-failure-vs-unless-stopped
    # semantics (the "no devices configured" exit-0 case in particular,
    # see entrypoint.sh) are now handled inside that script instead of by
    # Docker's restart policy, since sdr-rx no longer has its own
    # container to apply one to.
    build:
      context: .
      dockerfile: services/sdr_rx/Dockerfile
    restart: unless-stopped
    environment:
      TOCSIN_MODE: *mode
      SDR_RX_DEVICES: ${SDR_RX_DEVICES:-}
      # Manual gain in dB (design doc §3: "Auto gain oscillates on a
      # constant carrier"). 30 dB is a starting point for a typical setup,
      # not a universal value -- antenna, cable loss, and distance to the
      # transmitter all shift what's correct for a given site; see the
      # root README's "Tweak from there" bring-up step.
      SDR_RX_GAIN_DB: ${SDR_RX_GAIN_DB:-30}
      # Noise-quieting threshold in dB for the live-audio feed's squelch
      # only (never SAME decode or the alert ring buffer). Self-calibrating
      # against a runtime-tracked no-carrier reference, so unlike gain the
      # default should hold across sites -- see .env.example.
      SDR_RX_SQUELCH_OPEN_DB: ${SDR_RX_SQUELCH_OPEN_DB:-8.0}
      # Empty by default -- every channel gets both SDR-side processing
      # (voice filter/squelch/resample/encode) and an Icecast stream. Read
      # by sdr-rx *and* live_audio below (they share this one container),
      # not an SDR_RX_*-prefixed name for that reason. Most sites only have
      # usable signal on one or two of the seven NWR channels; the rest
      # otherwise did that work and ran a permanent ffmpeg/vorbis encode
      # for no listener. Narrow it to just what's useful at this site, e.g.
      # LIVE_AUDIO_CHANNELS=WX5,WX7 -- see .env.example. SAME decode and
      # the alert ring buffer are unaffected either way; this only gates
      # live-audio-bound work.
      LIVE_AUDIO_CHANNELS: ${LIVE_AUDIO_CHANNELS:-}
      SDR_RX_ZMQ_BIND: tcp://0.0.0.0:5555
      SDR_RX_RING_BUFFER_DIR: /run/sdr_rx_ring
      # Publishes RF health (tocsin:health) and per-site spectrum snapshots
      # (tocsin:spectrum:<site>) for api (Phase 8).
      SDR_RX_REDIS_URL: redis://redis:6379/0
      # same-decoder, live-audio, segment-capture: localhost, not
      # tcp://sdr-rx:5555 -- they're the same container as sdr-rx now, not
      # a separate one reaching it by service name.
      SAME_DECODER_ZMQ_CONNECT: tcp://localhost:5555
      TOCSIN_DATA_DIR: /app/data
      # Publishes to Redis Streams (tocsin:same_events) for fusion (design
      # doc §5: "Both paths write raw events to Redis Streams before
      # fusion sees them") instead of only logging to stdout.
      SAME_DECODER_REDIS_URL: redis://redis:6379/0
      LIVE_AUDIO_ZMQ_CONNECT: tcp://localhost:5555
      ICECAST_HOST: icecast
      ICECAST_PORT: ${ICECAST_PORT:-8000}
      ICECAST_SOURCE_USER: source
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      ICECAST_STREAM_NAME_TEMPLATE: ${ICECAST_STREAM_NAME_TEMPLATE:-Tocsin {site} {channel}}
      ICECAST_STREAM_DESCRIPTION: ${ICECAST_STREAM_DESCRIPTION:-Tocsin NOAA Weather Radio relay}
      ICECAST_STREAM_GENRE: ${ICECAST_STREAM_GENRE:-weather}
      # Empty by default -- only set LIVE_AUDIO_METADATA_CONFIG (and uncomment
      # the matching volume below) once you actually have a metadata.yaml
      # with site_names/channel_names display-name overrides to mount; see
      # services/live_audio/README.md.
      LIVE_AUDIO_METADATA_CONFIG: ${LIVE_AUDIO_METADATA_CONFIG:-}
      # Liveness heartbeat only (tocsin:status:live_audio) -- live-audio's
      # real output is the Icecast stream, not Redis. The heartbeat also
      # carries its mount list, which is what lets api's /streams show a
      # channel whose ffmpeg died; Icecast simply stops listing those.
      LIVE_AUDIO_REDIS_URL: redis://redis:6379/0
      SEGMENT_CAPTURE_ZMQ_CONNECT: tcp://localhost:5555
      # Liveness heartbeat only; captures still go out over ZMQ.
      SEGMENT_CAPTURE_REDIS_URL: redis://redis:6379/0
      # stt-worker (a separate container) connects to this one, so it
      # stays reachable by this service's name -- see stt-worker's
      # STT_WORKER_ZMQ_CONNECT below.
      SEGMENT_CAPTURE_ZMQ_BIND: tcp://0.0.0.0:5556
      SEGMENT_CAPTURE_RING_BUFFER_DIR: /run/sdr_rx_ring
      SEGMENT_CAPTURE_OUTPUT_DIR: /var/lib/segment_capture/captures
    depends_on:
      - redis
      - icecast
    # A private tmpfs, not the shared named volume this used to be
    # (`sdr-rx-ring`, removed) -- that only existed so segment-capture, a
    # *separate* container, could read sdr-rx's ring buffer over shared
    # backing memory (design doc §3, "pre-roll"). Now that both are the
    # same container/filesystem, a plain per-container tmpfs is enough
    # again, same as before segment-capture existed.
    tmpfs:
      - /run/sdr_rx_ring
    volumes:
      - ./data:/app/data:ro
      - segment-captures:/var/lib/segment_capture/captures
    devices:
      - /dev/bus/usb:/dev/bus/usb
    # /dev/bus/usb gives the container the whole USB bus rather than one
    # device node, because RTL-SDR dongles enumerate under a bus-relative
    # path that isn't stable across replugs -- device selection happens in
    # the app layer by serial (SDR_RX_DEVICES), not by bind-mounting one
    # /dev/bus/usb/BBB/DDD path. The host also needs the udev rule in
    # deploy/udev/ so the dongle is group-readable without running the
    # container privileged -- see this service's README for the full
    # bring-up sequence (blacklist, udev rule, `make sdr-devices`).
    profiles: [offgrid, hybrid]

  icecast:
    build: ./deploy/icecast
    restart: unless-stopped
    environment:
      # Drives the <listen-socket> port inside the container (rendered
      # from icecast.xml's ${ICECAST_PORT} by deploy/icecast/entrypoint.sh),
      # not just what other services dial.
      ICECAST_PORT: ${ICECAST_PORT:-8000}
    ports:
      # Host port and container port deliberately move together, unlike
      # api's below: the browser reaches a mount by the *host* port while
      # live-audio and api reach it by the *container* port, and both are
      # ICECAST_PORT. Mapping them to different numbers would silently
      # break the web UI's playback URLs for any deployment that hasn't
      # also set ICECAST_PUBLIC_URL.
      - "${ICECAST_PORT:-8000}:${ICECAST_PORT:-8000}"
    profiles: [offgrid, hybrid]

  stt-worker:
    build: ./services/stt_worker
    # on-failure covers real crashes (ZMQ, whisper-cli). A missing model
    # file at STT_WORKER_MODEL_PATH is no longer one of them: main() waits
    # for the file instead of exiting 1, so dropping a model into ./models/
    # is still picked up with no manual intervention, without the restart
    # loop that used to reprint the same line every few seconds into the
    # shared `docker compose logs` stream (see stt_worker's await_model).
    # STT_CHAIN=remote skips that wait entirely -- MODEL_PATH below is set
    # unconditionally but only read when the chain contains `local`.
    restart: on-failure
    environment:
      # sdr-rx, not segment-capture -- segment-capture no longer has its
      # own container/hostname (it's now one of sdr-rx's four processes,
      # still publishing its capture-ready ZMQ PUB socket on the same
      # port, just from that container's name instead of its own).
      STT_WORKER_ZMQ_CONNECT: tcp://sdr-rx:5556
      STT_WORKER_MODEL_PATH: /models/${STT_WORKER_MODEL_FILE:-ggml-base.en.bin}
      STT_WORKER_INITIAL_PROMPT: ${STT_WORKER_INITIAL_PROMPT:-}
      # Publishes to Redis Streams (tocsin:transcripts) for dispatcher's
      # stage 2 (design doc §5's durability principle, extended to
      # stt_worker -- Phase 7).
      STT_WORKER_REDIS_URL: redis://redis:6379/0
      # local-only by default (offgrid); hybrid deployments that want the
      # remote race set STT_CHAIN=local,remote plus the REMOTE_* vars
      # below in .env -- see services/stt_worker/README.md.
      STT_CHAIN: ${STT_CHAIN:-local}
      STT_WORKER_REMOTE_BASE_URL: ${STT_WORKER_REMOTE_BASE_URL:-}
      STT_WORKER_REMOTE_API_KEY: ${STT_WORKER_REMOTE_API_KEY:-}
      STT_WORKER_REMOTE_MODEL: ${STT_WORKER_REMOTE_MODEL:-whisper-1}
    volumes:
      - segment-captures:/var/lib/segment_capture/captures
      - ./models:/models:ro
    depends_on:
      - sdr-rx
      - redis
    profiles: [offgrid, hybrid]

  fusion:
    # Build context is the repo root, not services/fusion/ -- this image
    # also installs nws_poller (formerly its own container; see
    # entrypoint.sh) as a second, independent uv project/venv alongside
    # fusion's.
    build:
      context: .
      dockerfile: services/fusion/Dockerfile
    restart: unless-stopped
    environment:
      TOCSIN_MODE: *mode
      TOCSIN_DATA_DIR: /app/data
      FUSION_REDIS_URL: redis://redis:6379/0
      # nws-poller's own env (was its own compose service, gated by
      # `profiles: [hybrid]`; entrypoint.sh now gates it on TOCSIN_MODE at
      # container start instead -- see that file). Empty by default, not
      # `:?`-required, same reasoning as before the merge: a hard-required
      # var here would block `offgrid` startup too, even though this
      # entire block is skipped there -- exactly the regression
      # CLAUDE.md's connectivity rule warns about. nws_poller's own
      # __init__.py still fails loudly and exits 1 (retried by
      # entrypoint.sh) if this is unset, which only matters under
      # TOCSIN_MODE=hybrid where entrypoint.sh actually starts it.
      NWS_POLLER_USER_AGENT: ${NWS_POLLER_USER_AGENT:-}
      NWS_POLLER_AREAS: ${NWS_POLLER_AREAS:-OR,WA}
      # Optional, additive to NWS_POLLER_AREAS -- see .env.example.
      NWS_POLLER_ZONES: ${NWS_POLLER_ZONES:-}
      NWS_POLLER_INTERVAL_SECONDS: ${NWS_POLLER_INTERVAL_SECONDS:-60}
      NWS_POLLER_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - redis
    # both, unlike nws-poller's old hybrid-only profile: fusion itself
    # always runs (offgrid alerts simply stay RF_ONLY -- see fusion's
    # README), and the nws-poller half of this container now self-gates
    # on TOCSIN_MODE inside entrypoint.sh rather than never starting the
    # whole container under offgrid.
    profiles: [offgrid, hybrid]

  dispatcher:
    build: ./services/dispatcher
    # on-failure, not unless-stopped: a missing/unattached Meshtastic node
    # is a real, retriable failure (main() fails loudly and exits 1 rather
    # than crash with a raw traceback -- same posture as segment-capture's
    # ring-buffer-mount check) -- worth retrying once the node is plugged
    # in, unlike sdr-rx's deliberate "no devices configured" clean exit.
    restart: on-failure
    environment:
      TOCSIN_MODE: *mode
      TOCSIN_DATA_DIR: /app/data
      DISPATCHER_REDIS_URL: redis://redis:6379/0
      # Empty (unset) by default -> meshtastic-python autodetects the
      # device; only needed if more than one serial device is attached.
      MESHTASTIC_SERIAL_DEV_PATH: ${MESHTASTIC_SERIAL_DEV_PATH:-}
      # Defaults to false *here* and true in compose.mesh.yaml, so adding
      # that file to COMPOSE_FILE is the single switch that turns the mesh
      # on: it maps the device and enables the transmit path together.
      # Those two must agree -- enabling transmit without the device
      # mapping is a loud exit-1 at startup, not a degraded run.
      MESHTASTIC_ENABLED: ${MESHTASTIC_ENABLED:-false}
      # serial | tcp (design doc §7: "sendText(wantAck=True) over
      # serial/TCP"). A tcp node needs no device mapping, so it runs on
      # this file alone -- set MESHTASTIC_ENABLED=true explicitly rather
      # than adding compose.mesh.yaml, which exists only for the USB case.
      MESHTASTIC_TRANSPORT: ${MESHTASTIC_TRANSPORT:-serial}
      MESHTASTIC_TCP_HOST: ${MESHTASTIC_TCP_HOST:-}
      MESHTASTIC_TCP_PORT: ${MESHTASTIC_TCP_PORT:-4403}
      # MQTT fallback (design doc §7): only ever attempted under
      # TOCSIN_MODE=hybrid (see DualPathSender), and only if a gateway
      # node ID is actually configured -- both empty by default.
      MESHTASTIC_GATEWAY_NODE_ID: ${MESHTASTIC_GATEWAY_NODE_ID:-}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MESHTASTIC_MQTT_REGION: ${MESHTASTIC_MQTT_REGION:-US}
      # Stage 2 (design doc §7): unset by default -> stage 2 is skipped
      # entirely, never even consuming tocsin:transcripts (see
      # __init__.py's docstring on why "omitted," not "template-only,"
      # was chosen from the design doc's stated §8 options).
      DISPATCHER_LITELLM_BASE_URL: ${DISPATCHER_LITELLM_BASE_URL:-}
      DISPATCHER_LITELLM_API_KEY: ${DISPATCHER_LITELLM_API_KEY:-}
      DISPATCHER_LITELLM_MODEL: ${DISPATCHER_LITELLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/app/data:ro
    # No `devices:` here on purpose -- it lives in compose.mesh.yaml.
    # Docker refuses to *start* a container whose device path is absent
    # from the host, so a mapping in this file would make a node the hard
    # prerequisite for running Tocsin at all, including the receive-only
    # half (SAME decode, transcripts, web UI) that needs no radio.
    depends_on:
      - redis
      - fusion
      - mosquitto
    # both: stage 1 is deterministic and zero-dependency by design (§7) --
    # it works identically off-grid. Stage 2's LiteLLM call and the MQTT
    # fallback leg are the only mode/config-gated parts.
    profiles: [offgrid, hybrid]

  api:
    # Build context is the repo root, not services/api/ -- the Dockerfile's
    # first stage builds web/ (formerly its own nginx container; see
    # web/README.md and services/api/app.py's static mount) before the
    # Python runtime stage.
    build:
      context: .
      dockerfile: services/api/Dockerfile
    # on-failure: an unconfigured connection (neither API_POSTGRES_PASSWORD
    # nor API_POSTGRES_DSN) is main()'s own loud-fail-and-exit-1 check --
    # see services/api/README.md. A *slow* database is no longer part of
    # this policy's job: api waits for timescaledb to be healthy below and
    # then retries the connection itself, and it exits with one legible
    # block (not a repeating traceback) on the failures retrying can't fix,
    # e.g. a password that doesn't match the volume's.
    restart: on-failure
    environment:
      # Passed as parts, not as a single interpolated
      # `postgresql://tocsin:${POSTGRES_PASSWORD}@timescaledb:5432/tocsin`
      # URL: a password containing `@`, `:`, `/`, `?`, or `#` makes that
      # string parse as some *other* DSN and fail with "password
      # authentication failed" while .env is in fact correct. api
      # percent-encodes these itself (see config.py). API_POSTGRES_DSN is
      # still honored if set, for deployments pointing at their own
      # database.
      API_POSTGRES_HOST: timescaledb
      API_POSTGRES_PORT: "5432"
      API_POSTGRES_USER: tocsin
      API_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      API_POSTGRES_DB: tocsin
      API_REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      # Surfaced to the browser via GET /system. The UI cannot describe an
      # empty CAP column honestly without it: no API source means "offgrid
      # doesn't poll NWS at all" here and "the poller is broken" under
      # hybrid, and those look identical on screen otherwise.
      TOCSIN_MODE: *mode
      # Read-only, for GET /reference: SAME event codes (name + tier) and
      # the FIPS -> county table the UI needs to render "Multnomah, OR"
      # instead of "041051" and to tell a Tier A warning from a Tier C test.
      TOCSIN_DATA_DIR: /app/data
      # Optional: adds distance_km to each nwr_stations_or.yaml entry in
      # GET /reference, purely a UI hint. Both unset (the default) means
      # every station's distance_km is null.
      TOCSIN_LATITUDE: ${TOCSIN_LATITUDE:-}
      TOCSIN_LONGITUDE: ${TOCSIN_LONGITUDE:-}
      # Where segment-capture's finished WAVs land, so GET /captures/{name}
      # can serve the audio behind a transcript -- the guard-failed ones
      # especially, where stt_worker deliberately dropped the text.
      API_CAPTURES_DIR: /var/lib/segment_capture/captures
      ICECAST_HOST: icecast
      ICECAST_PORT: ${ICECAST_PORT:-8000}
      # What the *browser* should use to reach Icecast, which is not
      # `icecast:8000` -- that only resolves inside this network. Unset by
      # default so the page falls back to its own hostname on the Icecast
      # port, which is right for the usual "browse to the Pi on the LAN"
      # case; set it for deployments behind a reverse proxy where it isn't.
      ICECAST_PUBLIC_URL: ${ICECAST_PUBLIC_URL:-}
    volumes:
      - ./data:/app/data:ro
      # read-only: api serves these, segment-capture (in the sdr-rx
      # container) is the only writer.
      - segment-captures:/var/lib/segment_capture/captures:ro
    ports:
      # Was web/nginx's port before that container merged in here -- still
      # 8080 by default so the bring-up runbook (README.md) doesn't change.
      # TOCSIN_WEB_PORT is the one to change when 8080 is already taken on
      # the host; API_PORT only moves uvicorn's bind inside the container,
      # which nothing outside compose ever sees.
      - "${TOCSIN_WEB_PORT:-8080}:${API_PORT:-8000}"
    depends_on:
      redis:
        condition: service_started
      # service_healthy, not service_started: Postgres binds its port before
      # first-boot initialization finishes, so "started" is not "ready" here
      # and api would otherwise spend its startup window retrying a database
      # that isn't listening for real queries yet.
      timescaledb:
        condition: service_healthy
      # Not a hard requirement -- /streams degrades to live-audio's own
      # heartbeat view when Icecast is unreachable rather than erroring --
      # but starting it first avoids a pointless failed fetch on boot.
      icecast:
        condition: service_started
    profiles: [offgrid, hybrid]

volumes:
  redis-data:
  mosquitto-data:
  timescale-data:
  # Not tmpfs: finished captures are real data worth keeping across a
  # restart (replay, debugging a bad transcript), unlike the raw ring
  # buffer they're extracted from (a private `tmpfs:` mount on sdr-rx
  # itself now, not a named volume -- see that service's comment on why
  # it no longer needs to be shared across containers).
  segment-captures:
