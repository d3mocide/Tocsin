# Tocsin -- one compose file, two profiles (docs/design/master-prompt.md §1, §9).
#
#   TOCSIN_MODE=offgrid docker compose --profile offgrid up
#   TOCSIN_MODE=hybrid  docker compose --profile hybrid up
#
# Only services with a working implementation are defined below. Everything
# past milestone 1 (docs/design/master-prompt.md §10) is commented out with a pointer
# to its milestone -- uncomment as each is built and proven, per the build
# order. Docker was not available to build/run this file in the sandbox this
# was authored in; verify `docker compose config` and a real `up` on a
# machine with the daemon before relying on it.

x-mode: &mode ${TOCSIN_MODE:-offgrid}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    profiles: [offgrid, hybrid]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./deploy/mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    profiles: [offgrid, hybrid]

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tocsin
      POSTGRES_USER: tocsin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    profiles: [offgrid, hybrid]

  sdr-rx:
    build: ./services/sdr_rx
    # on-failure, not unless-stopped: with no SDR_RX_DEVICES configured (a
    # deliberately supported state -- see the README's bring-up runbook),
    # main() reports that and exits 0. unless-stopped restarts on ANY exit
    # including that one, crash-looping a container that isn't actually
    # crashing (confirmed against a real build). on-failure only restarts
    # the exit-1 path (bad serial / device error), which is the case that
    # actually warrants a retry.
    restart: on-failure
    environment:
      TOCSIN_MODE: *mode
      SDR_RX_DEVICES: ${SDR_RX_DEVICES:-}
      SDR_RX_ZMQ_BIND: tcp://0.0.0.0:5555
      SDR_RX_RING_BUFFER_DIR: /run/sdr_rx_ring
    tmpfs:
      - /run/sdr_rx_ring
    devices:
      - /dev/bus/usb:/dev/bus/usb
    # /dev/bus/usb gives the container the whole USB bus rather than one
    # device node, because RTL-SDR dongles enumerate under a bus-relative
    # path that isn't stable across replugs -- device selection happens in
    # the app layer by serial (SDR_RX_DEVICES), not by bind-mounting one
    # /dev/bus/usb/BBB/DDD path. The host also needs the udev rule in
    # deploy/udev/ so the dongle is group-readable without running the
    # container privileged -- see this service's README for the full
    # bring-up sequence (blacklist, udev rule, `make sdr-devices`).
    profiles: [offgrid, hybrid]

  same-decoder:
    build: ./services/same_decoder
    restart: unless-stopped
    environment:
      SAME_DECODER_ZMQ_CONNECT: tcp://sdr-rx:5555
      TOCSIN_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - sdr-rx
    profiles: [offgrid, hybrid]

  icecast:
    build: ./deploy/icecast
    restart: unless-stopped
    ports:
      - "8000:8000"
    profiles: [offgrid, hybrid]

  live-audio:
    build: ./services/live_audio
    restart: unless-stopped
    environment:
      LIVE_AUDIO_ZMQ_CONNECT: tcp://sdr-rx:5555
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      ICECAST_SOURCE_USER: source
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
    depends_on:
      - sdr-rx
      - icecast
    profiles: [offgrid, hybrid]

  # segment-capture:          # milestone 4
  #   build: ./services/segment_capture
  #   profiles: [offgrid, hybrid]

  # stt-worker:                # milestone 4
  #   build: ./services/stt_worker
  #   profiles: [offgrid, hybrid]

  # nws-poller:                # milestone 5 -- hybrid only (docs/design/master-prompt.md §8)
  #   build: ./services/nws_poller
  #   profiles: [hybrid]

  # fusion:                    # milestone 5
  #   build: ./services/fusion
  #   profiles: [offgrid, hybrid]

  # dispatcher:                # milestone 6-7
  #   build: ./services/dispatcher
  #   profiles: [offgrid, hybrid]

  # api:                       # milestone 8
  #   build: ./services/api
  #   profiles: [offgrid, hybrid]

  # web:                       # milestone 8
  #   build: ./web
  #   profiles: [offgrid, hybrid]

volumes:
  redis-data:
  mosquitto-data:
  timescale-data:
