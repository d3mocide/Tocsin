# Tocsin -- RTL-SDR USB passthrough overlay, merged on top of compose.yaml via
# COMPOSE_FILE (see .env.example). Included by default; it exists as a separate
# file only so a machine with no USB subsystem can still bring the stack up
# (Docker refuses to start a container whose `devices:` host path is missing),
# not because a real station is expected to run without it.
#
# `make up-offgrid` and `make up-hybrid` append this to COMPOSE_FILE if .env
# left it out -- both are deployment modes and a station with no SDR receives
# nothing. `make dev-stack` is the one target that deliberately runs without it.
# Drop it from a bare `docker compose` invocation only when no dongle is
# attached; sdr-rx fails loudly at startup if SDR_RX_DEVICES is set and the bus
# isn't mapped (services/sdr_rx/src/sdr_rx/prerequisites.py).
#
# The whole tree, not a specific device path: sdr-rx's own libusb resolves
# each dongle's real bus/device node via host sysfs (/sys/bus/usb/devices,
# shared read-only into the container -- not confined by `devices:`), so a
# fabricated container-side path never matches what it actually opens.
# Selection is already by SERIAL, not index (SDR_RX_DEVICES, capture.py) --
# the remaining hazard is this bind mount going stale across a USB bus
# renumbering (replug, reboot, a bus reset caused by something else sharing
# the hub) while the container keeps running, which reads exactly like a
# bad serial: `rtlsdr_get_device_usb_strings failed` plus
# `rtlsdr_get_index_by_serial - -3`. deploy/udev/61-rtlsdr-tocsin-hotplug.rules
# fixes that by restarting this container -- refreshing the mount -- every
# time SDR_RX_DEVICES' configured serial(s) enumerate, regardless of what
# bus/device number they land on.

services:
  sdr-rx:
    devices:
      - /dev/bus/usb:/dev/bus/usb
