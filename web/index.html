<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Tocsin</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>Tocsin</h1>
        <div id="mode-chip"></div>
      </div>
      <div id="connection-status"></div>
    </header>

    <main class="layout">
      <div class="main-column">
        <section class="panel panel-streams" aria-labelledby="streams-heading">
          <div class="panel-head"><h2 id="streams-heading">Live audio</h2></div>
          <div id="streams"></div>
        </section>

        <section class="panel" aria-labelledby="nwr-stations-heading">
          <div class="panel-head"><h2 id="nwr-stations-heading">Nearby NWR stations</h2></div>
          <div id="nwr-stations"></div>
        </section>

        <section class="panel panel-feed" aria-labelledby="alerts-heading">
          <div class="panel-head">
            <h2 id="alerts-heading">Alert feed</h2>
          </div>
          <div id="filters" class="filters"></div>
          <!-- Announced politely: a new alert arriving should reach a screen
               reader without stealing focus from whatever is being read. -->
          <div id="alerts" class="alert-feed" aria-live="polite" aria-busy="false">
            <p class="empty">Loading…</p>
          </div>
        </section>

        <section class="panel" aria-labelledby="activity-heading">
          <div class="panel-head"><h2 id="activity-heading">Activity</h2></div>
          <div id="activity"></div>
        </section>
      </div>

      <div class="sidebar">
        <section class="panel" aria-labelledby="spectrum-heading">
          <div class="panel-head">
            <h2 id="spectrum-heading">Spectrum</h2>
            <select id="spectrum-site-select" class="filter-select" aria-label="Spectrum site"></select>
          </div>
          <canvas id="spectrum-canvas" width="640" height="260"></canvas>
        </section>

        <section class="panel" aria-labelledby="rf-health-heading">
          <div class="panel-head"><h2 id="rf-health-heading">RF channels</h2></div>
          <div id="rf-health"></div>
        </section>

        <section class="panel" aria-labelledby="stats-heading">
          <div class="panel-head"><h2 id="stats-heading">System health</h2></div>
          <div id="stats" class="stats-grid"></div>
        </section>

        <section class="panel" aria-labelledby="services-heading">
          <div class="panel-head"><h2 id="services-heading">Services</h2></div>
          <div id="services"></div>
        </section>

        <section class="panel" aria-labelledby="dispatch-heading">
          <div class="panel-head"><h2 id="dispatch-heading">Dispatch</h2></div>
          <div id="dispatch"></div>
        </section>
      </div>
    </main>

    <footer>
      <p>
        Tocsin is a monitoring, logging, and relay system, not a replacement for a
        dedicated battery-backed SAME weather radio.
      </p>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
