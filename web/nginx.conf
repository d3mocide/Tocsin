server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app -- unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxies /api/* to the api service, stripping the /api prefix (its
    # own routes are unprefixed -- see services/api/app.py). This is what
    # lets src/api.ts default to same-origin "/api" with no build-time
    # API_BASE_URL override needed in production.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE (/api/alerts/stream): buffering would hold events in nginx
        # until a buffer fills instead of forwarding them as they arrive,
        # defeating the whole point of a live feed.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
